related_posts: 3
title: Nomentum Immobiliare
baseurl: "/nomentumimmobiliare"
url: "https://cialdecompatibili-netizen.github.io"
email: ""
description: "Nomentum Immobiliare: agenzia immobiliare a Mentana e dintorni. Vendita, affitto e valutazione gratuita di case, appartamenti e ville a Mentana, Monterotondo, Fonte Nuova e Sant'Angelo Romano."
footer_text: "&copy; 2026 Nomentum Immobiliare"
minimal_mistakes_skin: default
search: true

# SEO globale
author:
  name: "Nomentum Immobiliare"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Agenzia immobiliare a Mentana. Ti seguiamo dalla valutazione alla firma dal notaio, a Mentana e nei comuni vicini."
  links:
    - label: "Valutazione gratuita"
      icon: "fas fa-fw fa-envelope"
      url: "/nomentumimmobiliare/contatti/"

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
exclude:
  - vendor
  - docs

permalink: /:categories/:title/

timezone:

collections:
  negozio:
    output: true
    permalink: /negozio/:name/
  products:
    output: true
    permalink: /shop/:name/
  servizi:
    output: true
    permalink: /servizi/:name/
  progetti:
    output: true
    permalink: /progetti/:name/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links: []

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: products
    values:
      layout: product
      classes: wide
  - scope:
      path: ""
      type: servizi
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: progetti
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

cms_homepage:

# E-commerce spento: per un'agenzia immobiliare non serve il negozio (il codice resta nel repo, riattivabile da admin > Impostazioni).
ecommerce: false
# Ordini (SMOKE TEST, nessun pagamento): il browser scrive una riga nel foglio Google chiamando questo Apps Script. Vuoto = il pulsante 'Invia richiesta d'ordine' resta spento.
ordini:
  tracker: ""
